# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Chicago'

    open-pull-requests-limit: 5

    commit-message:
      prefix: 'deps'
      include: 'scope'

    labels:
      - dependencies

    cooldown:
      semver-major-days: 7
      semver-minor-days: 2

    # SDK 3 requires a coordinated migration of the entire telemetry family.
    # Its experimental 0.300+ releases are breaking despite being minor bumps.
    ignore:
      # Formatter upgrades require an explicit repository-wide style refresh.
      - dependency-name: 'prettier'
        versions: ['>=3.9.0']
      # @fastify/swagger 9.8.2+ changes nullable schema serialization,
      # breaking the committed OpenAPI snapshot until the contract is regenerated and reviewed.
      - dependency-name: '@fastify/swagger'
        versions: ['>=9.8.2']
      - dependency-name: '@opentelemetry/api'
        versions: ['>=1.10.0']
      # The 0.223 OTel line imports API.logs, which is absent from the supported API 1.9 line.
      # SDK 2.8+ also needs a coordinated telemetry compatibility check before updating.
      - dependency-name: '@opentelemetry/*'
        versions: ['>=0.217.0 <1.0.0']
      - dependency-name: '@opentelemetry/sdk-*'
        versions: ['>=2.8.0 <3.0.0']
      # Major upgrades need coordinated compiler, coverage, and test-runner migrations.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['>=5.0.0']

    groups:
      npm-minor-patch:
        patterns:
          - '*'
        exclude-patterns:
          - '@opentelemetry/*'
        update-types:
          - 'minor'
          - 'patch'
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Chicago'

    commit-message:
      prefix: 'ci'
      include: 'scope'

    labels:
      - dependencies
      - ci

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Chicago'

    commit-message:
      prefix: 'docker'
      include: 'scope'

    labels:
      - dependencies
      - docker
