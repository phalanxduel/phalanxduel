# phalanxduel.localhost — reverse proxy to the local dev stack (bin/demo up).
#
# Project-owned vhost (same pattern as just3ws.github.io/nginx/just3ws.localhost.conf
# and my.conf / decision-011: the project owns its vhost, not zdots). Deploy with
# bin/install-localhost.
#
# Unlike just3ws (which serves a static built _site/), this proxies to the live
# dev servers bin/demo starts. client/vite.config.ts already proxies /api, /ws,
# /health, /matches to the fastify server, and admin/vite.config.ts proxies
# /admin-api to the admin backend — nginx only has to reach the two vite ports.
#
#   play.phalanxduel.localhost   -> 127.0.0.1:5173  (client; bin/demo up)
#   admin.phalanxduel.localhost  -> 127.0.0.1:3103  (admin UI; pnpm dev:admin,
#                                    separate from bin/demo)
#   phalanxduel.localhost        -> redirects to play (no local marketing-site
#                                    dev server is in scope here; point this at
#                                    the `site` repo's own dev server later if
#                                    that's ever wanted)
#
# TLS: shared zdots-local cert via ssl_params.conf. Run nginx-regen-certs after
# installing this vhost to add these hostnames to the cert's SAN list.
# .localhost auto-resolves to loopback (RFC 6761); no /etc/hosts entry.

server {
    listen 80;
    server_name phalanxduel.localhost play.phalanxduel.localhost admin.phalanxduel.localhost;
    return 301 https://play.phalanxduel.localhost$request_uri;
}

server {
    listen 443 ssl;
    server_name phalanxduel.localhost;
    include ssl_params.conf;
    return 301 https://play.phalanxduel.localhost$request_uri;
}

server {
    listen 443 ssl;
    server_name play.phalanxduel.localhost;
    include ssl_params.conf;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Forwarded through to vite's dev-server proxy, which needs it for both
        # its own HMR socket and the app's /ws game connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name admin.phalanxduel.localhost;
    include ssl_params.conf;

    location / {
        proxy_pass http://127.0.0.1:3103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
