# phalanxduel.localhost — local site, game, and admin entrypoints.
#
# Project-owned vhost (same pattern as just3ws.github.io/nginx/just3ws.localhost.conf
# and my.conf / decision-011: the project owns its vhost, not zdots). Deploy with
# bin/install-localhost.
#
# The site is the static Jekyll export from the sibling site repository. The
# game and admin hosts proxy to the live dev servers phx-demo-ctl starts.
#
#   play.phalanxduel.localhost   -> 127.0.0.1:5173  (client; phx-demo-ctl up)
#   admin.phalanxduel.localhost  -> 127.0.0.1:3103  (admin UI; pnpm dev:admin,
#                                    separate from phx-demo-ctl)
#   phalanxduel.localhost        -> /opt/homebrew/var/www/phalanxduel
#   phalanxduel.localhost/demo/  -> 127.0.0.1:3333  (generated local cockpit;
#                                    404 when the bridge/artifact is absent)
#
# TLS: shared zdots-local cert via ssl_params.conf. Run nginx-regen-certs after
# installing this vhost to add these hostnames to the cert's SAN list.
# .localhost auto-resolves to loopback (RFC 6761); no /etc/hosts entry.

server {
    listen 80;
    server_name phalanxduel.localhost play.phalanxduel.localhost admin.phalanxduel.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name phalanxduel.localhost;
    include ssl_params.conf;

    root /opt/homebrew/var/www/phalanxduel;
    index index.html;

    # The cockpit is generated into the ignored repo-local .phx directory and
    # served through its loopback bridge. Keep this location ahead of the
    # site's SPA fallback so a missing cockpit stays an honest 404.
    location = /demo {
        return 301 /demo/;
    }

    location /demo/ {
        proxy_pass http://127.0.0.1:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 502 503 504 =404 /__phx_demo_missing;
    }

    location = /__phx_demo_missing {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name play.phalanxduel.localhost;
    include ssl_params.conf;

    # This is a host-native Vite development proxy. Do not make nginx buffer
    # HMR, WebSocket-adjacent responses, browser telemetry, or dev assets into
    # Homebrew's proxy/client temp paths; those paths are owned by the host
    # nginx service and are a common source of local 502s.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;

    # Same-origin OTLP/HTTP ingress for the browser SDK. The collector stays
    # loopback-only; nginx supplies the trusted local HTTPS boundary.
    location /otel/ {
        proxy_pass http://127.0.0.1:4318/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Forwarded through to vite's dev-server proxy, which needs it for both
        # its own HMR socket and the app's /ws game connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name admin.phalanxduel.localhost;
    include ssl_params.conf;

    location / {
        proxy_pass http://127.0.0.1:3103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
